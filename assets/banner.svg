<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#4338ca" /><stop offset="100%" style="stop-color:#6d28d9" /></linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#6d28d9" /><stop offset="100%" style="stop-color:#7c2fd4" /></linearGradient>
    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#7c2fd4" /><stop offset="100%" style="stop-color:#9333ea" /></linearGradient>
<filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#6366f1" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>
  </g>
  
  <!-- Connection lines (DAG visualization) -->
  <g stroke="#8b5cf6" stroke-width="2" fill="none" opacity="0.85">
    <!-- Main flow -->
    <path d="M 150 215 L 300 165" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 150 215 L 300 265" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 300 165 L 500 165" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 300 265 L 500 265" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 500 165 L 700 165" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 500 265 L 700 265" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Agent nodes -->
  <g filter="url(#softGlow)">
    <!-- Architect node -->
    <circle cx="150" cy="215" r="35" fill="url(#nodeGrad1)" opacity="0.9">
      <animate attributeName="r" values="35;37;35" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="150" y="210" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">🏗️</text>
    <text x="150" y="230" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Architect</text>
    
    <!-- Coder node -->
    <circle cx="300" cy="165" r="30" fill="url(#nodeGrad2)" opacity="0.9">
      <animate attributeName="r" values="30;32;30" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="300" y="160" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">💻</text>
    <text x="300" y="180" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Coder</text>
    
    <!-- Reviewer node -->
    <circle cx="300" cy="265" r="30" fill="url(#nodeGrad2)" opacity="0.9">
      <animate attributeName="r" values="30;32;30" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="300" y="260" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">🔍</text>
    <text x="300" y="280" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Reviewer</text>
    
    <!-- Tester node -->
    <circle cx="500" cy="165" r="30" fill="url(#nodeGrad3)" opacity="0.9">
      <animate attributeName="r" values="30;32;30" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <text x="500" y="160" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">🧪</text>
    <text x="500" y="180" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Tester</text>
    
    <!-- Explorer node -->
    <circle cx="500" cy="265" r="30" fill="url(#nodeGrad3)" opacity="0.9">
      <animate attributeName="r" values="30;32;30" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <text x="500" y="260" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">🔬</text>
    <text x="500" y="280" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Explorer</text>
    
    <!-- Designer node (hub: "Designer" is too wide to sit inside an r=30 disc
         at the cy+15 label baseline, where the disc is only 52px across) -->
    <circle cx="700" cy="165" r="35" fill="url(#nodeGrad1)" opacity="0.9">
      <animate attributeName="r" values="35;37;35" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="700" y="160" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">🎨</text>
    <text x="700" y="180" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Designer</text>
    
    <!-- Docs node -->
    <circle cx="700" cy="265" r="30" fill="url(#nodeGrad1)" opacity="0.9">
      <animate attributeName="r" values="30;32;30" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <text x="700" y="260" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">📝</text>
    <text x="700" y="280" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Docs</text>
  </g>
  
  <!-- Cost indicator -->
  <g transform="translate(900, 120)">
    <rect x="0" y="0" width="200" height="80" rx="8" fill="#1e1e3a" stroke="#6366f1" stroke-width="1" opacity="0.8"/>
    <text x="20" y="25" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">💰 Cost-Aware Routing</text>
    <text x="20" y="50" fill="#6366f1" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700">$0.42</text>
    <text x="95" y="50" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">/ $10.00</text>
    <rect x="20" y="62" width="160" height="6" rx="3" fill="#1e293b"/>
    <rect x="20" y="62" width="67" height="6" rx="3" fill="url(#accentGrad)">
      <animate attributeName="width" values="60;67;60" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Features -->
  <g transform="translate(900, 220)">
    <rect x="0" y="0" width="200" height="150" rx="8" fill="#1e1e3a" stroke="#8b5cf6" stroke-width="1" opacity="0.8"/>
    <text x="20" y="25" fill="#c4b5fd" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">⚡ Features</text>
    <text x="20" y="50" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Effort-Aware Routing</text>
    <text x="20" y="68" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Git-Flow Convention</text>
    <text x="20" y="86" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Provider-Grouped Picker</text>
    <text x="20" y="104" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Bundled Design Skills</text>
    <text x="20" y="122" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Custom Roles &amp; Presets</text>
    <text x="20" y="140" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Web Dashboard</text>
  </g>
  
  <!-- Main title -->
  <text x="600" y="80" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" letter-spacing="-1">OpenCode Nexus</text>
  <text x="600" y="115" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">Adaptive Multi-Agent Orchestration with Cost Intelligence</text>
  
  <!-- Bottom bar -->
  <rect x="0" y="380" width="1200" height="20" fill="#0f0f23" opacity="0.8"/>
  <text x="600" y="395" text-anchor="middle" fill="#818cf8" font-family="monospace" font-size="12" font-weight="500">@serkanalgur/opencode-nexus • MIT License</text>
</svg>
